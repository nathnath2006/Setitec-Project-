<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setitec Performance Workbench</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='6' y='1' width='4' height='14' rx='1' fill='%230b0b0b'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem("setitec.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/studies"><b>SETITEC</b><span>Performance workbench</span></a>
    <div class="spacer"></div>
    <span class="dataset" id="dataset"></span>
    <button class="profile-btn" id="profile-btn" aria-label="Account menu">N</button>
    <button class="icon-btn" id="theme-btn" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 2a6 6 0 0 1 0 12z" fill="currentColor"/></svg>
    </button>
  </header>
  <main id="app" aria-live="polite"></main>
  <script src="/vendor/plotly.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
